name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - master

env:
  PROJECT_ID: kagaz-ai
  SERVICE: kagaz-ai-backend
  REGION: us-central1

jobs:
  deploy:
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Container
        run: |-
          docker build -t us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/kagaz-repo/${{ env.SERVICE }}:${{ github.sha }} ./backend
          docker push us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/kagaz-repo/${{ env.SERVICE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/kagaz-repo/${{ env.SERVICE }}:${{ github.sha }}
          env: |-
            ENV_MODE=production
            DATABASE_URL=sqlite:////tmp/kagaz_ai.db
            UPLOAD_DIR=/tmp/uploads
            SECRET_KEY=${{ secrets.KAGAZ_SECRET_KEY }}
            ALLOWED_ORIGINS=${{ secrets.KAGAZ_ALLOWED_ORIGINS }}
            # Optional Groq fallback (Cloud Run CPU cannot run the 7B vision
            # model locally — set GROQ_API_KEY for AI to work at all)
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            GROQ_MODEL=meta-llama/llama-4-scout-17b-16e-instruct
